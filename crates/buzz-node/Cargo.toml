[package]
name = "buzz-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
buzz-core = { path = "../buzz-core" }
buzz-ws-client = { path = "../buzz-ws-client" }
nostr = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
# Home-directory resolution for the node config file (`~/.buzz-node/config.json`).
dirs = "6"
# `buzz-node` binary CLI (subcommands: up/enroll/autostart/status/stop).
# Mirrors buzz-cli/buzz-admin's version pin.
clap = { version = "4", features = ["derive"] }

# Process-group signaling for graceful agent-process shutdown (mirrors
# buzz-dev-mcp's KillGroup use of the same crate/features).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }

# OS keychain backing for the node's own signing key (never a plaintext file —
# see `enroll::KeychainStore`). Mirrors `desktop/src-tauri/Cargo.toml`'s
# per-platform keyring backend + `vendored` feature selection exactly.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "vendored"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "vendored"] }

[features]
# Exposes the in-memory FakeSubstrate/FakeRelay for cross-crate tests (Phase 5 e2e).
test-utils = []

[dev-dependencies]
# `test-util` enables paused-time control (`start_paused`, `time::advance`)
# for the deterministic presence-heartbeat cadence test in `engine.rs`.
# Mirrors buzz-acp/buzz-cli's dev-dependency-only `test-util` opt-in.
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
# Raw WebSocket server plumbing for `nostr_relay`'s in-process fake-relay
# test harness (accept a TCP connection, speak the NIP-42 handshake, script
# REQ/EVENT/EOSE frames) — proves `NostrNodeRelay`'s real dual-subscription
# multiplexing and reconnect behavior without a live relay. Mirrors
# `buzz-acp`'s identical `tokio::net::TcpListener` + `tokio_tungstenite`
# dev-dependency-only test pattern.
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
# Owner-side test client (connect/authenticate/subscribe/collect) for the
# gated two-node e2e proof (`tests/e2e_nodes.rs`) — publishes
# NODE_ENROLLMENT/AGENT_ASSIGNMENT and observes AGENT_NODE_STATUS against a
# real relay. Mirrors `buzz-relay`'s identical dev-dependency-only use.
buzz-test-client = { path = "../buzz-test-client" }

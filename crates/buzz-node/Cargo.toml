[package]
name = "buzz-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
buzz-core = { path = "../buzz-core" }
nostr = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
zeroize = { workspace = true }

# Process-group signaling for graceful agent-process shutdown (mirrors
# buzz-dev-mcp's KillGroup use of the same crate/features).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }

[features]
# Exposes the in-memory FakeSubstrate/FakeRelay for cross-crate tests (Phase 5 e2e).
test-utils = []

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
